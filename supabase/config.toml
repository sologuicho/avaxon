project_id = "wprvjhvtnyibiwpeiusc"

# Solo se listan aquí las funciones nuevas de cron (daily-report,
# reactivate-cold-leads). El resto (webhook-wa, send-message, landing-*,
# admin-*) se configuraron por fuera de este archivo y no se tocan.

[functions.daily-report]
verify_jwt = false
# 22:00 hora de Ciudad de México (UTC-6, sin horario de verano) = 04:00 UTC
cron = "0 4 * * *"

[functions.reactivate-cold-leads]
verify_jwt = false
# cada 6 horas
cron = "0 */6 * * *"

[functions.resume-paused-conversations]
verify_jwt = false
# cada 15 min — retoma conversaciones needs_human si nadie respondió dentro
# del tiempo configurado por la org (organization_profile.
# human_handoff_timeout_hours, 2h por defecto)
cron = "*/15 * * * *"

[functions.pay]
verify_jwt = false
# Link corto de pago (avaxon.lat/p/<id> → checkout_url). Público.

# ── Publicaciones en redes (feature/publicaciones-redes) ───────────────────
# NO desplegado a producción todavía -- estas entradas quedan declaradas
# aquí para cuando se autorice el deploy, no activan nada por sí solas.

[functions.social-post-scheduler]
verify_jwt = false
# cada 2 min — cola unificada de publicaciones programadas/en reintento,
# para Facebook e Instagram (no se usa el scheduled_publish_time nativo de
# Facebook, todo pasa por este cron)
cron = "*/2 * * * *"

[functions.social-token-health-check]
verify_jwt = false
# diario, 07:00 hora de Ciudad de México (UTC-6) = 13:00 UTC — chequeo
# proactivo de tokens de Meta, para que "Token expirado" se detecte antes
# de que falle un intento real de publicar
cron = "0 13 * * *"
