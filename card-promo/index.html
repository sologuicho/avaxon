document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ion style=\"padding:44px 0 36px;display:flex;flex-direction:column;gap:28px;\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <p style=\"margin:0;font-size:15px;color:#B5B0A5;\">Gracias por escanear nuestra tarjeta.<\u002Fp>\n        <h1 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;line-height:1.02;letter-spacing:-.025em;text-wrap:balance;\">Tu WhatsApp contesta solo, a cualquier hora.<\u002Fh1>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#B5B0A5;text-wrap:pretty;max-width:36ch;\">Ponemos un agente de IA en el WhatsApp de tu negocio. Atiende a tus clientes, califica a los interesados y agenda citas, aunque tú estés ocupado o dormido.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <a href=\"{{ waMain }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:0 20px;border-radius:12px;background:#25D366;color:#0B1A10;font-weight:700;font-size:16.5px;transition:background .2s, transform .1s;\" style-hover=\"background:#36DC74;color:#0B1A10;\" style-active=\"transform:scale(.985);\">\n          <span>Hablar por WhatsApp<\u002Fspan>\n          <span style=\"font-size:18px;\">→<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://avaxon.lat\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:0 20px;border-radius:12px;border:1px solid #3A3934;color:#F1ECE2;font-weight:600;font-size:16.5px;transition:border-color .2s;\" style-hover=\"border-color:#6B685F;color:#F1ECE2;\">\n          <span>Ver página principal<\u002Fspan>\n          <span style=\"font-size:18px;color:#8A867C;\">↗<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"sandbox\" style=\"padding:36px 0 40px;border-top:1px solid #2B2A26;display:flex;flex-direction:column;gap:22px;\">\n      <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;line-height:1.08;letter-spacing:-.02em;text-wrap:balance;\">Prueba cómo respondería tu agente<\u002Fh2>\n\n      <label style=\"position:relative;display:flex;flex-direction:column;gap:6px;cursor:pointer;\">\n        <span style=\"font-size:13px;color:#8A867C;\">Mi negocio es…<\u002Fspan>\n        <span style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:0 18px;border-radius:12px;background:#1C1B18;border:1px solid #3A3934;\">\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:21px;letter-spacing:-.01em;\">{{ currentPhrase }}<\u002Fspan>\n          <span style=\"font-size:13px;color:#8A867C;\">Cambiar ▾<\u002Fspan>\n        <\u002Fspan>\n        <sc-raw-select value=\"{{ giroId }}\" sc-camel-on-change=\"{{ onSelect }}\" aria-label=\"Giro de negocio\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;\">\n          <sc-for list=\"{{ options }}\" as=\"o\" hint-placeholder-count=\"0\">\n            <option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n      <p style=\"margin:-10px 0 0;font-size:13px;line-height:1.5;color:#8A867C;\">Aquí ves 8 ejemplos. Tenemos más de 30 plantillas listas y adaptamos la tuya a tus precios, horarios y forma de hablar.<\u002Fp>\n\n      <div style=\"border-radius:20px;overflow:hidden;background:#EAE5DA;color:#1A1A17;\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;background:#F7F4EE;border-bottom:1px solid #DDD7CA;\">\n          <div style=\"width:38px;height:38px;border-radius:50%;background:#1A1A17;color:#F1ECE2;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;flex-shrink:0;\">{{ initial }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:1px;min-width:0;\">\n            <span style=\"font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ bizName }}<\u002Fspan>\n            <span style=\"font-size:12px;color:{{ statusColor }};\">{{ status }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:16px 12px 14px;min-height:400px;\">\n          <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"0\">\n            <div style=\"align-self:{{ m.align }};max-width:82%;background:{{ m.bg }};padding:8px 11px 6px;border-radius:{{ m.radius }};font-size:14.5px;line-height:1.42;box-shadow:0 1px 0 rgba(0,0,0,.06);animation:msgIn .3s ease both;display:flex;flex-direction:column;gap:2px;\">\n              <span style=\"text-wrap:pretty;\">{{ m.text }}<\u002Fspan>\n              <span style=\"align-self:flex-end;font-size:10.5px;color:#7A766C;\">{{ m.meta }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ typing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"align-self:flex-start;background:#FFFFFF;padding:12px 14px;border-radius:2px 12px 12px 12px;display:flex;gap:4px;box-shadow:0 1px 0 rgba(0,0,0,.06);\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#7A766C;animation:dot 1.1s infinite;\"><\u002Fspan>\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#7A766C;animation:dot 1.1s .15s infinite;\"><\u002Fspan>\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#7A766C;animation:dot 1.1s .3s infinite;\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ done }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ replay }}\" style=\"align-self:center;margin-top:auto;background:transparent;border:none;color:#6B675E;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;min-height:44px;padding:0 12px;text-decoration:underline;text-underline-offset:3px;\" style-hover=\"color:#1A1A17;\">Ver de nuevo<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <a href=\"{{ waAgent }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:0 20px;border-radius:12px;background:#25D366;color:#0B1A10;font-weight:700;font-size:16.5px;transition:background .2s, transform .1s;\" style-hover=\"background:#36DC74;color:#0B1A10;\" style-active=\"transform:scale(.985);\">\n        <span>Quiero este agente para mi negocio<\u002Fspan>\n        <span style=\"font-size:18px;\">→<\u002Fspan>\n      <\u002Fa>\n    <\u002Fsection>\n\n    <section style=\"background:#F1ECE2;color:#141412;border-radius:16px;padding:28px 22px 22px;display:flex;flex-direction:column;gap:20px;\">\n      <div style=\"display:flex;align-items:flex-end;gap:14px;\">\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:96px;line-height:.8;letter-spacing:-.05em;\">7<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;padding-bottom:4px;\">días<br>gratis<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:20px;line-height:1.4;font-weight:600;letter-spacing:-.005em;text-wrap:pretty;\">1 semana gratis, sin pagos anticipados. Si no te convence, no pagas nada.<\u002Fp>\n      <a href=\"{{ waTrial }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 20px;border-radius:12px;background:#141412;color:#F1ECE2;font-weight:700;font-size:16px;\" style-hover=\"background:#2A2925;color:#F1ECE2;\">\n        <span>Empezar mi semana gratis<\u002Fspan>\n        <span>→<\u002Fspan>\n      <\u002Fa>\n    <\u002Fsection>\n\n    <footer style=\"display:flex;justify-content:space-between;gap:12px;padding:28px 2px 0;font-size:12px;color:#8A867C;\">\n      <span>Hecho en México<\u002Fspan>\n      <a href=\"https://avaxon.lat\" style=\"color:#8A867C;\" style-hover=\"color:#F1ECE2;\">avaxon.lat<\u002Fa>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;528991709336&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultGiro&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;restaurante&quot;,&quot;clinica&quot;,&quot;salon&quot;,&quot;inmobiliaria&quot;,&quot;gimnasio&quot;,&quot;dentista&quot;,&quot;taller&quot;,&quot;escuela&quot;],&quot;default&quot;:&quot;restaurante&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}\">\nconst GIROS = [\n  { id:'restaurante', label:'Restaurante', phrase:'un restaurante', biz:'La Terraza', msgs:[\n    ['u','Hola, ¿tienen mesa para 4 hoy a las 9?'],\n    ['b','¡Hola! Sí tenemos lugar hoy a las 9:00 pm para 4 personas. ¿Prefieren terraza o adentro?'],\n    ['u','Terraza porfa'],\n    ['b','Listo, quedó a tu nombre en terraza, hoy 9:00 pm. Te mando un recordatorio una hora antes. ¿Te paso el menú del día?']]},\n  { id:'clinica', label:'Clínica', phrase:'una clínica', biz:'Clínica San Rafael', msgs:[\n    ['u','Buenas, ¿cuánto cuesta la consulta general?'],\n    ['b','Hola, la consulta general cuesta $650. Tengo espacio mañana a las 10:30 am o a las 5:00 pm. ¿Cuál te acomoda?'],\n    ['u','La de las 5'],\n    ['b','Agendado: mañana 5:00 pm con la Dra. Méndez. Llega 10 minutos antes con una identificación. Mañana temprano te recuerdo.']]},\n  { id:'salon', label:'Salón de belleza', phrase:'un salón de belleza', biz:'Studio Bella', msgs:[\n    ['u','¿Tienen espacio para tinte y corte el sábado?'],\n    ['b','¡Claro! El sábado tengo 11:00 am y 3:30 pm. Tinte + corte va desde $1,200 y son como 2 horas y media. ¿Qué horario prefieres?'],\n    ['u','11 am'],\n    ['b','Te aparté el sábado 11:00 am con Fernanda. Para confirmar te pido un anticipo de $200 por transferencia, aquí te dejo los datos.']]},\n  { id:'inmobiliaria', label:'Inmobiliaria', phrase:'una inmobiliaria', biz:'Grupo Hábitat', msgs:[\n    ['u','Vi el depa en Polanco, ¿sigue disponible?'],\n    ['b','Sí sigue: 2 recámaras, 95 m², $28,000 al mes. ¿Es para ti o para tu empresa, y para cuándo te mudarías?'],\n    ['u','Para mí, en diciembre'],\n    ['b','Perfecto. Te puedo agendar una visita el jueves a las 12:00 o el viernes a las 6:00 pm con un asesor. ¿Cuál te queda?']]},\n  { id:'gimnasio', label:'Gimnasio', phrase:'un gimnasio', biz:'Iron Fit', msgs:[\n    ['u','¿Cuánto cuesta la mensualidad?'],\n    ['b','Hola, la mensualidad es de $799 con clases grupales y pesas, y este mes no cobramos inscripción. ¿Quieres venir a una clase de prueba gratis?'],\n    ['u','Sí, mañana temprano'],\n    ['b','Te anoté mañana a las 7:00 am en funcional. Trae toalla y agua, y pregunta por Carlos en recepción.']]},\n  { id:'dentista', label:'Consultorio dental', phrase:'un consultorio dental', biz:'Sonríe Dental', msgs:[\n    ['u','Me duele una muela, ¿me pueden atender hoy?'],\n    ['b','Qué mal, lo siento. Tenemos un espacio de urgencia hoy a las 4:15 pm. La valoración cuesta $400 y se abona al tratamiento. ¿Te lo aparto?'],\n    ['u','Sí por favor'],\n    ['b','Listo, hoy 4:15 pm con el Dr. Ruiz. Te mando la ubicación por aquí. Si necesitas cambiar la hora, solo escríbeme.']]},\n  { id:'taller', label:'Taller mecánico', phrase:'un taller mecánico', biz:'Taller Hernández', msgs:[\n    ['u','¿Cuánto sale la afinación para un Versa 2019?'],\n    ['b','Para un Versa 2019 la afinación mayor sale en $2,350 con bujías, filtros y aceite. Son unas 3 horas. ¿Qué día lo traerías?'],\n    ['u','El lunes'],\n    ['b','Va, el lunes a las 9:00 am. Te aviso por aquí en cuanto tu auto esté listo.']]},\n  { id:'escuela', label:'Escuela de idiomas', phrase:'una escuela de idiomas', biz:'Academia Lingua', msgs:[\n    ['u','Info de clases de inglés para adultos'],\n    ['b','¡Con gusto! Hay grupos entre semana de 7 a 9 pm y sabatinos de 9 a 1. ¿Qué nivel tienes: básico, intermedio o avanzado?'],\n    ['u','Intermedio'],\n    ['b','Hay un grupo intermedio que empieza el 1 de diciembre. Te puedo agendar un examen de ubicación gratis esta semana. ¿En línea o presencial?']]}\n];\nconst TIMES = ['23:14','23:14','23:15','23:15'];\n\nclass Component extends DCLogic {\n  state = { giro: null, shown: 0, typing: false };\n  timers = [];\n  componentDidMount() { this.pick(this.props.defaultGiro ?? 'restaurante'); }\n  componentWillUnmount() { this.clear(); }\n  clear() { this.timers.forEach(clearTimeout); this.timers = []; }\n  pick(id) {\n    this.clear();\n    const g = GIROS.find(x => x.id === id) || GIROS[0];\n    this.setState({ giro: g.id, shown: 0, typing: false });\n    const sp = this.props.speed ?? 1;\n    let t = 350 * sp;\n    g.msgs.forEach(([from, text], i) => {\n      if (from === 'b') {\n        this.timers.push(setTimeout(() => this.setState({ typing: true }), t));\n        t += Math.min(2200, 700 + text.length * 10) * sp;\n      } else t += 450 * sp;\n      this.timers.push(setTimeout(() => this.setState({ shown: i + 1, typing: false }), t));\n      t += 600 * sp;\n    });\n  }\n  wa(text) {\n    const n = (this.props.whatsappNumber ?? '528991709336').replace(/\\D/g, '');\n    return `https://wa.me/${n}?text=${encodeURIComponent(text)}`;\n  }\n  renderVals() {\n    const g = GIROS.find(x => x.id === this.state.giro) || GIROS[0];\n    return {\n      options: GIROS.map(x => ({ id: x.id, label: x.label })),\n      giroId: g.id,\n      currentPhrase: g.phrase.charAt(0).toUpperCase() + g.phrase.slice(1),\n      onSelect: e => this.pick(e.target.value),\n      bizName: g.biz,\n      initial: g.biz.replace(/^(La|El|Grupo|Studio|Taller|Clínica|Academia)\\s/, '').charAt(0),\n      status: this.state.typing ? 'escribiendo…' : 'en línea',\n      statusColor: this.state.typing ? '#128C4A' : '#7A766C',\n      typing: this.state.typing,\n      done: this.state.shown >= g.msgs.length,\n      replay: () => this.pick(g.id),\n      messages: g.msgs.slice(0, this.state.shown).map(([from, text], i) => {\n        const u = from === 'u';\n        return { text, align: u ? 'flex-end' : 'flex-start', bg: u ? '#D6F5CF' : '#FFFFFF',\n          radius: u ? '12px 2px 12px 12px' : '2px 12px 12px 12px',\n          meta: u ? `${TIMES[i]} ✓✓` : TIMES[i] };\n      }),\n      waMain: this.wa('Hola, escaneé la tarjeta de Avaxon y quiero saber más sobre el agente para WhatsApp.'),\n      waAgent: this.wa(`Hola, probé el ejemplo de ${g.phrase} y quiero un agente así para mi negocio.`),\n      waTrial: this.wa('Hola, quiero empezar mi semana gratis con Avaxon.')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
