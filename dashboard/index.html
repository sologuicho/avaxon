<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaxon — Dashboard</title>
  <link rel="icon" type="image/jpeg" href="../avaxon_favicon.jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #04040f;
      --bg-2:      #07071a;
      --bg-card:   #0a0a20;
      --border:    rgba(255,255,255,0.07);
      --border-hi: rgba(0,200,255,0.25);
      --cyan:      #00c8ff;
      --cyan-dim:  rgba(0,200,255,0.12);
      --indigo:    #4f46e5;
      --white:     #ffffff;
      --text:      #e2e8f0;
      --text-muted:#64748b;
      --text-dim:  #94a3b8;
      --green:     #10b981;
      --red:       #ef4444;
      --yellow:    #f59e0b;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      background-image:
        linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-hi);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 60px rgba(0,200,255,0.08);
    }

    .login-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    input[type="email"], input[type="password"] {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="email"]:focus, input[type="password"]:focus {
      border-color: var(--cyan);
    }

    .btn-primary {
      width: 100%;
      background: var(--cyan);
      color: #000;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      padding: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      color: var(--red);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* ── DASHBOARD ── */
    #dashboard-screen { display: none; }

    header {
      background: rgba(4,4,15,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--cyan);
    }

    .header-logo span {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 13px;
      margin-left: 8px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-email {
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-signout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-family: inherit;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-signout:hover {
      border-color: var(--red);
      color: var(--red);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 32px;
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.2s;
    }

    .stat-card:hover { border-color: var(--border-hi); }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--white);
    }

    .stat-value.cyan { color: var(--cyan); }

    /* Tables */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .table-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-header h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    .badge {
      background: var(--cyan-dim);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 24px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 24px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(255,255,255,0.02); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .status-pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-active  { color: var(--green); background: rgba(16,185,129,0.1); }
    .status-pending { color: var(--yellow); background: rgba(245,158,11,0.1); }
    .status-inactive{ color: var(--text-muted); background: rgba(100,116,139,0.1); }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .empty-state-icon { font-size: 32px; margin-bottom: 12px; }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-muted);
      font-size: 14px;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      main { padding: 24px 16px; }
      header { padding: 0 16px; }
      .user-email { display: none; }
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen" class="loading">
  <div class="spinner"></div> Cargando…
</div>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Avaxon</div>
    <div class="login-subtitle">Panel de administración</div>
    <div class="form-group">
      <label for="email">Correo</label>
      <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-primary" id="login-btn">Entrar</button>
    <div class="error-msg" id="error-msg"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard-screen">
  <header>
    <div class="header-logo">Avaxon <span>/ Dashboard</span></div>
    <div class="header-right">
      <span class="user-email" id="user-email"></span>
      <button class="btn-signout" id="signout-btn">Salir</button>
    </div>
  </header>

  <main>
    <!-- Stats -->
    <div class="section-title">Resumen</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Organizaciones</div>
        <div class="stat-value cyan" id="stat-orgs">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Contactos</div>
        <div class="stat-value" id="stat-contacts">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Conversaciones</div>
        <div class="stat-value" id="stat-convs">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Mensajes</div>
        <div class="stat-value" id="stat-msgs">—</div>
      </div>
    </div>

    <!-- Organizations -->
    <div class="section-title">Organizaciones</div>
    <div class="table-card">
      <div class="table-header">
        <h2>Clientes activos</h2>
        <span class="badge" id="orgs-badge">0</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Slug</th>
            <th>Plan</th>
            <th>Estado</th>
            <th>Creado</th>
          </tr>
        </thead>
        <tbody id="orgs-body"></tbody>
      </table>
    </div>

    <!-- Recent Contacts -->
    <div class="section-title">Contactos recientes</div>
    <div class="table-card">
      <div class="table-header">
        <h2>Últimos contactos</h2>
        <span class="badge" id="contacts-badge">0</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th>Última vez</th>
          </tr>
        </thead>
        <tbody id="contacts-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const SUPABASE_URL = 'https://wprvjhvtnyibiwpeiusc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_w4HF23xO6Nq85926OrAOlg_Bvogo1HX';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);

  function show(id) {
    ['loading-screen', 'login-screen', 'dashboard-screen'].forEach(s => {
      $(s).style.display = s === id ? (s === 'login-screen' ? 'flex' : s === 'dashboard-screen' ? 'block' : 'flex') : 'none';
    });
  }

  function statusPill(status) {
    const map = {
      active: ['active', 'Activo'],
      suspended: ['inactive', 'Suspendido'],
      cancelled: ['inactive', 'Cancelado'],
      new: ['pending', 'Nuevo'],
      contacted: ['pending', 'Contactado'],
      qualified: ['active', 'Calificado'],
      won: ['active', 'Ganado'],
      lost: ['inactive', 'Perdido'],
    };
    const [cls, label] = map[status] || ['pending', status];
    return `<span class="status-pill status-${cls}">${label}</span>`;
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function emptyRow(cols, msg) {
    return `<tr><td colspan="${cols}"><div class="empty-state"><div class="empty-state-icon">📭</div>${msg}</div></td></tr>`;
  }

  async function loadDashboard(user) {
    $('user-email').textContent = user.email;

    const [
      { count: orgsCount },
      { count: contactsCount },
      { count: convsCount },
      { count: msgsCount },
      { data: orgs },
      { data: contacts },
    ] = await Promise.all([
      sb.from('organizations').select('*', { count: 'exact', head: true }),
      sb.from('contacts').select('*', { count: 'exact', head: true }),
      sb.from('conversations').select('*', { count: 'exact', head: true }),
      sb.from('messages').select('*', { count: 'exact', head: true }),
      sb.from('organizations').select('id, name, slug, plan_id, status, created_at').order('created_at', { ascending: false }),
      sb.from('contacts').select('id, name, phone, status, last_seen_at, created_at').order('created_at', { ascending: false }).limit(10),
    ]);

    $('stat-orgs').textContent = orgsCount ?? 0;
    $('stat-contacts').textContent = contactsCount ?? 0;
    $('stat-convs').textContent = convsCount ?? 0;
    $('stat-msgs').textContent = msgsCount ?? 0;
    $('orgs-badge').textContent = orgsCount ?? 0;
    $('contacts-badge').textContent = contactsCount ?? 0;

    // Orgs table
    const orgsBody = $('orgs-body');
    if (!orgs || orgs.length === 0) {
      orgsBody.innerHTML = emptyRow(5, 'Sin organizaciones todavía');
    } else {
      orgsBody.innerHTML = orgs.map(o => `
        <tr>
          <td><strong>${o.name}</strong></td>
          <td style="color:var(--text-muted);font-family:monospace;font-size:12px">${o.slug}</td>
          <td>${o.plan_id ? `<span style="color:var(--cyan);font-size:12px">${o.plan_id}</span>` : '—'}</td>
          <td>${statusPill(o.status)}</td>
          <td style="color:var(--text-muted);font-size:13px">${fmtDate(o.created_at)}</td>
        </tr>
      `).join('');
    }

    // Contacts table
    const contactsBody = $('contacts-body');
    if (!contacts || contacts.length === 0) {
      contactsBody.innerHTML = emptyRow(4, 'Sin contactos todavía');
    } else {
      contactsBody.innerHTML = contacts.map(c => `
        <tr>
          <td>${c.name || '<span style="color:var(--text-muted)">Sin nombre</span>'}</td>
          <td style="font-family:monospace;font-size:13px">${c.phone}</td>
          <td>${statusPill(c.status)}</td>
          <td style="color:var(--text-muted);font-size:13px">${fmtDate(c.last_seen_at || c.created_at)}</td>
        </tr>
      `).join('');
    }
  }

  // Auth
  $('login-btn').addEventListener('click', async () => {
    const email = $('email').value.trim();
    const password = $('password').value;
    const btn = $('login-btn');
    const errEl = $('error-msg');

    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando…';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    btn.textContent = 'Entrar';

    if (error) {
      errEl.textContent = error.message === 'Invalid login credentials'
        ? 'Correo o contraseña incorrectos.'
        : error.message;
      errEl.style.display = 'block';
    }
  });

  $('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('login-btn').click();
  });

  $('signout-btn').addEventListener('click', () => sb.auth.signOut());

  // Auth state listener
  sb.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      show('dashboard-screen');
      await loadDashboard(session.user);
    } else {
      show('login-screen');
    }
  });

  // Initial session check
  sb.auth.getSession().then(({ data: { session } }) => {
    if (!session) show('login-screen');
  });
</script>
</body>
</html>
